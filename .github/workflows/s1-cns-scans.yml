---
name: SentinelOne CNS Scan

on:  # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [master]

jobs:
  s1_scanner:
    uses: TykTechnologies/github-actions/.github/workflows/s1-cns-scan.yml@df343b28cd00636f436f6a2b9988d4e1784ced5e  # TT-18378-setup-go-version
    permissions:
      contents: read
    with:
      iac_enabled: false
      vuln_enabled: false
      policy_id: ${{ vars.S1_POLICY_ID }}
      scope_type: ACCOUNT
    secrets:
      S1_API_TOKEN: ${{ secrets.S1_API_TOKEN }}
      CONSOLE_URL: ${{ secrets.S1_CONSOLE_URL }}
      SCOPE_ID: ${{ secrets.S1_SCOPE_ID }}
