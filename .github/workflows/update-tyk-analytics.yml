# Keep the branch on tyk-analytics in sync with this branch

name: Update tyk-analytics branch

on:
  push:
    branches:
      - master
      - release-**
      - integration/**

jobs:
  sync:
    name: tyk-analytics
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0 # zizmor: ignore[github-app] owner-wide token, scoping tracked separately
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies

      - uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: TykTechnologies/tyk-analytics
          event-type: new-tyk
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
      - uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: TykTechnologies/tyk-sink
          event-type: new-tyk
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
