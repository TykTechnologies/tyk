name: Trigger Force Merge

on:
  issue_comment:
    types: [created]

jobs:
  call_force_merge:
    uses: TykTechnologies/github-actions/.github/workflows/force-merge.yaml@df343b28cd00636f436f6a2b9988d4e1784ced5e  # TT-18378-setup-go-version
    secrets:
      PROBE_APP_ID: ${{ secrets.PROBE_APP_ID }}
      PROBE_APP_PRIVATE_KEY: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.FORCE_MERGE_SLACK_WEBHOOK }}
