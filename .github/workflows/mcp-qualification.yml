# Mirrored in Gateway and Pump; Dashboard owns the stack runner and fixtures.
name: Serial MCP stack qualification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  qualify:
    name: MCP ${{ matrix.serializer }} / ${{ matrix.storage }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        serializer: [msgpack, protobuf]
        storage: [mongo, postgres]
    env:
      GOWORK: 'off'
      GOPRIVATE: github.com/TykTechnologies
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      TYK_TEST_DB_NAME: tt18006_v2
      TYK_TEST_MONGODB: 127.0.0.1:27017
      TYK_TEST_REDIS: 127.0.0.1
      TYK_TEST_REDIS_PORT: '6379'
      TYK_TEST_KEYCLOAK_URL: http://127.0.0.1:8180
      TYK_TEST_KEYCLOAK_INTERNAL_URL: http://127.0.0.1:8180
      TYK_TEST_UPSTREAM_URL: http://127.0.0.1:9879/
      MCP_REDIS_IMAGE: ${{ matrix.storage == 'postgres' && 'valkey/valkey:9' || 'redis:7' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies
      - name: Resolve coordinated source revisions
        id: revisions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          for component in gateway dashboard pump; do
            case "$component" in
              gateway) repository=TykTechnologies/tyk ;;
              dashboard) repository=TykTechnologies/tyk-analytics ;;
              pump) repository=TykTechnologies/tyk-pump ;;
            esac
            if [ "$repository" = "$CALLER_REPOSITORY" ]; then
              revision=$CALLER_SHA
            elif revision=$(gh api "repos/$repository/git/ref/heads/$SOURCE_BRANCH" --jq '.object.sha'); then
              :
            else
              revision=$(gh api "repos/$repository/git/ref/heads/$BASE_BRANCH" --jq '.object.sha')
            fi
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
            echo "$component=$revision" >> "$GITHUB_OUTPUT"
            echo "$component source revision: $revision"
          done
      - name: Checkout Dashboard and owned test runner
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: TykTechnologies/tyk-analytics
          ref: ${{ steps.revisions.outputs.dashboard }}
          token: ${{ steps.app-token.outputs.token }}
          path: mcp/dashboard
      - name: Checkout Gateway
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: TykTechnologies/tyk
          ref: ${{ steps.revisions.outputs.gateway }}
          token: ${{ steps.app-token.outputs.token }}
          path: mcp/gateway
      - name: Checkout Pump
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: TykTechnologies/tyk-pump
          ref: ${{ steps.revisions.outputs.pump }}
          token: ${{ steps.app-token.outputs.token }}
          path: mcp/pump
      - name: Checkout immutable mock fixtures
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: TykTechnologies/tyk-mock-mcp-server
          ref: 29fefa17ad1a8ce168a66ccc7680030d46cfbb13
          token: ${{ steps.app-token.outputs.token }}
          path: mcp/mock
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: mcp/dashboard/go.mod
          cache-dependency-path: |
            mcp/dashboard/go.sum
            mcp/gateway/go.sum
            mcp/pump/go.sum
            mcp/mock/go.sum
      - name: Configure private module fetch
        env:
          ORG_GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: git config --global url."https://x-access-token:${ORG_GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mcp/dashboard/tests/api/requirements.txt
      - name: Install owned test dependencies
        run: python -m pip install -r mcp/dashboard/tests/api/requirements.txt
      - name: Check owned runner regressions
        run: |
          python -m pytest --rootdir=mcp/dashboard/tests/api/scripts \
            -c mcp/dashboard/tests/api/pytest_local.ini -o addopts= -o env= -n 0 \
            mcp/dashboard/tests/api/scripts/test_run_mcp_v2.py \
            mcp/dashboard/tests/api/scripts/test_run_mcp_v2_stack.py -q
      - name: Start dedicated backing services
        run: docker compose -p mcp-qualification -f mcp/dashboard/tests/api/fixtures/mcp_v2/compose.yml up -d --wait --wait-timeout 120
      - name: Select PostgreSQL profile
        if: matrix.storage == 'postgres'
        run: |
          echo 'TYK_TEST_DASHBOARD_POSTGRES_DSN=host=127.0.0.1 port=5432 user=tt18006 password=local-qa-only dbname=tt18006_v2 sslmode=disable' >> "$GITHUB_ENV"
          echo 'TYK_TEST_MCP_POSTGRES_DSN=host=127.0.0.1 port=5432 user=tt18006 password=local-qa-only dbname=tt18006_v2 sslmode=disable' >> "$GITHUB_ENV"
      - name: Build current sources and run complete MCP coverage serially
        env:
          TYK_DB_LICENSEKEY: ${{ secrets.DASH_LICENSE }}
        run: |
          python mcp/dashboard/tests/api/scripts/run_mcp_v2_stack.py \
            --gateway-root mcp/gateway --pump-root mcp/pump --mock-root mcp/mock \
            --artifacts mcp-evidence --serializer '${{ matrix.serializer }}' \
            --dashboard-storage '${{ matrix.storage }}' --allow-declared-skips \
            --hash-key-function '${{ matrix.storage == 'postgres' && 'murmur128' || 'sha256' }}' \
            --pytest-marker 'mcp and not local and not dind and not mdcb and not upgrade and not resilience' \
            tests/
      - name: Retain sanitized qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-qualification-${{ matrix.serializer }}-${{ matrix.storage }}
          path: |
            mcp-evidence/qualification.json
            mcp-evidence/tested-shas.json
            mcp-evidence/*-binary-version.txt
            mcp-evidence/*-candidate.diff
          if-no-files-found: warn
      - name: Stop task-owned backing services
        if: always()
        run: docker compose -p mcp-qualification -f mcp/dashboard/tests/api/fixtures/mcp_v2/compose.yml down --volumes
