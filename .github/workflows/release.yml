# yamllint disable rule:line-length rule:truthy
---
name: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  schedule:
    - cron: "0 0 * * 1"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - master
      - release-**
    tags:
      - 'v*'

jobs:
  release:
    uses: TykTechnologies/github-actions/.github/workflows/release-tyk.yml@TT-18139-releng-poc
    secrets: inherit
    permissions:
      id-token: write   # AWS OIDC
      contents: read    # actions/checkout
      actions: read     # report_logs in the called workflow
    with:
      # Per-branch: 1.24-bullseye on release-5.3, 1.26-bullseye on master/5.8+
      golang_cross: 1.26-bullseye
