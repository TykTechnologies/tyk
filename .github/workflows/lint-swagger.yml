# yamllint disable rule:line-length rule:truthy
---
name: "Lint swagger schema"

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'swagger.yml'
      - 'ci/codegen/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dep-guard:
    uses: TykTechnologies/github-actions/.github/workflows/dependency-guard.yml@production
    permissions:
      contents: read

  redocly_validator:
    needs: [dep-guard]
    runs-on: ubuntu-latest
    name: Validate the swagger with redocly cli

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 20
      - name: Validate OpenAPI definition with redocly
        run: |
          npm install --ignore-scripts @redocly/cli@1.33.0 -g
          redocly lint swagger.yml --config=redocly.yml

  diff_swagger:
    needs: [dep-guard]
    name: Diff swagger yaml for comment
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0 # zizmor: ignore[github-app] owner-wide token, scoping tracked separately
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies

      - name: Use GitHub Token
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: >
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Checkout repo
        uses: TykTechnologies/github-actions/.github/actions/checkout-pr@production
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Golang
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version: stable

      - name: Install dyff binary
        run: |
          # this is the upstream, missing -w (trim whitespace)
          # curl --silent --location https://git.io/JYfAY | bash
          git clone --depth=1 https://github.com/aoktox/dyff
          cd dyff && go install ./cmd/...

      - name: Set up comment author
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Collect
        run: |
          cp swagger.yml swagger-current.yml

          git checkout -- .
          git fetch --depth=1 origin ${{ github.base_ref }}
          git checkout ${{ github.base_ref }}

          cp swagger.yml swagger-prev.yml

      - name: Diff
        id: api-check
        run: |
          set +e
          dyff between -c on --ignore-whitespace-changes -i swagger-prev.yml swagger-current.yml
          dyff between -c off --ignore-whitespace-changes -i swagger-prev.yml swagger-current.yml | egrep -v '^    . ' | sort > changes.txt

          LINE_COUNT=$(wc -l < changes.txt)

          echo "diff-output<<EOF" >> $GITHUB_OUTPUT
          if [ $LINE_COUNT -gt 200 ]; then
            echo "Changes in swagger.yml too large (line count ${LINE_COUNT}), check CI lint action for differences" >> $GITHUB_OUTPUT
          else
            cat changes.txt >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Find Comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad  # v4.0.0
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Swagger Changes

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9  # v5.0.0
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Swagger Changes
            ```diff
            ${{ steps.api-check.outputs.diff-output || 'no api changes detected' }}
            ```
          edit-mode: replace

  codegen_check:
    needs: [dep-guard]
    runs-on: ubuntu-latest
    name: Generate and compile clients from the swagger
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version: stable
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 20
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Maven
        env:
          MAVEN_VERSION: 3.9.16
          MAVEN_SHA512: 831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o maven.tar.gz "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          echo "${MAVEN_SHA512}  maven.tar.gz" | sha512sum -c --quiet
          tar -xzf maven.tar.gz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Generate and compile clients
        run: ci/codegen/check.sh swagger.yml
