# yamllint disable rule:line-length
---
name: Run CI tests and smoke tests

on:  # yamllint disable-line rule:truthy
  workflow_call:

jobs:
  opentelemetry-e2e:
    name: Opentelemetry e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52  # v3.0.0
        with:
          version: 3
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - id: ecr-login
        uses: ./.github/actions/ecr-login

      - name: Run e2e opentelemetry tests
        env:
          GATEWAY_IMAGE: ${{ steps.ecr-login.outputs.registry }}/tyk:sha-${{ github.sha }}
        run: task opentelemetry

  opentelemetry-metrics-e2e:
    name: Opentelemetry Metrics e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52  # v3.0.0
        with:
          version: 3
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - id: ecr-login
        uses: ./.github/actions/ecr-login

      - name: Run e2e metrics tests
        env:
          GATEWAY_IMAGE: ${{ steps.ecr-login.outputs.registry }}/tyk:sha-${{ github.sha }}
        run: task opentelemetry-metrics

  ci-tests:
    name: CI Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - id: ecr-login
        uses: ./.github/actions/ecr-login

      - name: Setup CI Tooling
        uses: shrink/actions-docker-extract@f1ef61065b78731fe3310b4e84e511f6a927a77e  # v4
        with:
          image: tykio/ci-tools@sha256:1796c0938247f42c580c501f7cd04e1144a59a62c6d8ba743572ff40371e1306  # latest
          path: /usr/local/bin/.
          destination: /usr/local/bin

      - name: Run /ci/tests
        shell: bash
        env:
          GITHUB_TAG: ${{ github.ref }}
          GATEWAY_IMAGE: ${{ steps.ecr-login.outputs.registry }}/tyk:sha-${{ github.sha }}
          PLUGIN_COMPILER_IMAGE: ${{ steps.ecr-login.outputs.registry }}/tyk-plugin-compiler:sha-${{ github.sha }}
        run: |
          set -eaxo pipefail
          for d in ci/tests/*/
          do
              echo Attempting to test $d
              if [ -d $d ] && [ -e $d/test.sh ]; then
                  cd $d
                  ./test.sh
                  cd -
              fi
          done

  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - id: ecr-login
        uses: ./.github/actions/ecr-login

      - name: Run /ci/smoke-tests

        # This job only runs whenever a tag is created. A tag is required
        # for a functional plugin compiler build for when the GO_GET=1 env
        # is provided. The plugin compiler cannot fetch the referenced
        # commit from a PR, but requires a /heads or /tags reference.
        #
        # See https://github.com/golang/go/issues/31191 for more info.

        shell: bash
        env:
          GITHUB_TAG: ${{ github.ref }}
          GATEWAY_IMAGE: ${{ steps.ecr-login.outputs.registry }}/tyk:sha-${{ github.sha }}
          PLUGIN_COMPILER_IMAGE: ${{ steps.ecr-login.outputs.registry }}/tyk-plugin-compiler:sha-${{ github.sha }}
        run: |
          set -eaxo pipefail
          for d in ci/smoke-tests/*/
          do
              echo Attempting to test $d
              if [ -d $d ] && [ -e $d/test.sh ]; then
                  cd $d
                  ./test.sh
                  cd -
              fi
          done
