name: MCP v2 stack validation
on:
  pull_request:
    branches: [master, 'TT-*-v2-*']
permissions:
  contents: read
concurrency:
  group: mcp-v2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    if: contains(github.head_ref, '-v2-mcp-') || contains(github.head_ref, '-v2-modern-mcp-')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    services:
      redis:
        image: redis:6-alpine
        ports: ['6379:6379']
    env:
      GOWORK: 'off'
      CI: 'true'
      PYTHON_VERSION: '3.11'
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install setuptools google 'protobuf==4.24.4'
      - name: Record immutable dependency versions
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/commit.txt
          go list -m all > artifacts/modules.txt
          test "$(go list -m -f '{{.Version}}' github.com/modelcontextprotocol/go-sdk)" = v1.6.0
          go mod verify
      - name: Build plugin fixture
        run: go build -cover -tags 'goplugin dev' -buildmode=plugin -o test/goplugins/goplugins.so ./test/goplugins
      - name: Complete Gateway and affected package tests
        run: go test -json -p 1 -parallel 1 -cover -tags 'goplugin dev' -timeout 15m -count=1 ./gateway ./internal/mcp/... ./internal/jsonrpc/... ./internal/httpctx ./internal/httputil ./apidef/... ./config ./user > artifacts/gateway.json 2>&1
      - name: Race tests for changed shared packages
        run: go test -json -p 1 -race -count=1 ./internal/mcp/... ./internal/jsonrpc/... ./internal/httpctx ./internal/httputil ./apidef/... ./config ./user > artifacts/shared-race.json 2>&1
      - name: Race tests for MCP response filtering and request state
        run: go test -json -p 1 -parallel 1 -race -tags 'goplugin dev' -count=1 ./gateway -run 'SSETap|FilteredSSE|MCP.*(Origin|Protocol|Ingress|Discovery)|CredentialSpecificMCPFiltering|ResponseCacheRejectsCredentialRepresentationWithoutRewrite|ResponseCacheMiddleware_SkipsEditedAndStreamingMCPResponses|ModernClassifiedCode' > artifacts/gateway-race.json 2>&1
      - name: Produce JUnit report
        if: always()
        run: |
          go run gotest.tools/gotestsum@v1.13.0 --junitfile artifacts/gateway.xml --raw-command cat artifacts/gateway.json
          if test -f artifacts/shared-race.json; then go run gotest.tools/gotestsum@v1.13.0 --junitfile artifacts/shared-race.xml --raw-command cat artifacts/shared-race.json; fi
          if test -f artifacts/gateway-race.json; then go run gotest.tools/gotestsum@v1.13.0 --junitfile artifacts/gateway-race.xml --raw-command cat artifacts/gateway-race.json; fi
      - name: Production and development builds
        run: |
          go build -tags goplugin -trimpath -o /tmp/tyk-production .
          go build -tags 'goplugin dev' -o /tmp/tyk-development .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mcp-v2-gateway-validation
          retention-days: 30
          path: artifacts/
